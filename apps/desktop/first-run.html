<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NXPayment</title>
    <style>
      body {
        font-family: Georgia, "Times New Roman", serif;
        background: linear-gradient(180deg, #ebe6db, #e7efe9);
        color: #14201b;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main {
        max-width: 36rem;
      }
      h1 {
        font-size: 2.4rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #5c6b63;
        line-height: 1.5;
      }
      code {
        font-family: ui-monospace, monospace;
        background: #e5eee8;
        padding: 0.1rem 0.35rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>NXPayment</h1>
      <p>
        Starting API + Web… If this stays blank, open
        <code>http://127.0.0.1:4321/merchant/tokens</code>
        after <code>npm run dev:up</code> in your checkout.
      </p>
      <p>Paste secrets only in the Tokens UI — never commit them.</p>
    </main>
  </body>
</html>
